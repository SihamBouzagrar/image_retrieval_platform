
name: Python CI

on:
  push:
    branches:
      - main
      - master
      - feature/ci-pipeline

  pull_request:
    branches:
      - main
      - master

jobs:
  code-quality:
    name: Code Quality and Validation
    runs-on: ubuntu-22.04

    steps:
      # 1. Retrieve source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.7"

      # 3. Install code quality tool
      - name: Install Flake8
        run: |
          python -m pip install flake8==5.0.4

      # 4. Check PEP 8 compliance
      - name: Run Flake8
        run: |
          flake8 image_retrieval.py retrieval/ \
            --max-line-length=100 \
            --statistics

      # 5. Validate Python syntax
      - name: Check Python syntax
        run: |
          python -m compileall -q image_retrieval.py retrieval/

      - name: Check Python syntax
        run: |
          python -m compileall -q image_retrieval.py retrieval/
